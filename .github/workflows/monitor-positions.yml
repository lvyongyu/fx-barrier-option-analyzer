name: Monitor Barrier Positions

# Daily check of real positions in data/positions.sqlite3. When a barrier is
# first touched, an email alert fires (Gmail SMTP) and the updated status is
# committed back so the alert is not repeated. Requires repository secrets:
#   GMAIL_ADDRESS, GMAIL_APP_PASSWORD   (recipient defaults to GMAIL_ADDRESS;
#   set ALERT_EMAIL_TO to send elsewhere). Twilio SMS secrets are an optional
#   fallback (TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER, ALERT_TO_NUMBER).

on:
  schedule:
    # 21:10 UTC daily — after the US session, before the next Asia open.
    - cron: "10 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not send SMS, only log what would be sent"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: monitor-positions
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Check positions and alert
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_TO_NUMBER: ${{ secrets.ALERT_TO_NUMBER }}
        shell: bash
        run: |
          ARGS=(--db data/positions.sqlite3 check --period 2y)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--notify)
          fi
          python -m src.monitor_cli "${ARGS[@]}"

      - name: Commit status changes
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data/positions.sqlite3)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/positions.sqlite3
            git commit -m "Update barrier position status [skip ci]"
            git push
          else
            echo "No position status changes to commit."
          fi
